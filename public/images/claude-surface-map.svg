<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Claude surface map</title>
<desc>A diagram showing how the four Surface Selector questions lead to eight different Claude surfaces: Chat, Connectors, Web Search, Projects, Skills, Memory, File Creation, Artifacts, Claude Code, Cowork, and Claude Design.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5B5647" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="520" rx="16" fill="#F7F5EF"/>

<!-- Center hub -->
<rect x="270" y="24" width="140" height="48" rx="10" fill="#0B2447" stroke="#0B2447" stroke-width="0.5"/>
<text x="340" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#F7F5EF">Your task</text>

<!-- Connector from hub down -->
<line x1="340" y1="72" x2="340" y2="96" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Row 1: thinking vs making -->
<rect x="120" y="96" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="220" y="116" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#0C447C">Thinking</text>
<text x="220" y="134" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">Answer, one-time</text>

<rect x="360" y="96" width="200" height="52" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="460" y="116" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#712B13">Making</text>
<text x="460" y="134" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#993C1D">Produces a file, tool, or code</text>

<line x1="270" y1="96" x2="220" y2="96" stroke="#5B5647" stroke-width="0.5"/>
<line x1="410" y1="96" x2="460" y2="96" stroke="#5B5647" stroke-width="0.5"/>

<!-- Chat from Thinking -->
<line x1="220" y1="148" x2="220" y2="172" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="140" y="172" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="220" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#0C447C">Chat</text>

<!-- Needs outside data -->
<line x1="220" y1="216" x2="220" y2="240" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="120" y="240" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="220" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#3C3489">Needs live outside data?</text>

<line x1="170" y1="284" x2="140" y2="308" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="40" y="308" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="105" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#3C3489">Connectors</text>

<line x1="270" y1="284" x2="300" y2="308" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="180" y="308" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="245" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#3C3489">Web search</text>

<!-- Recurring -->
<line x1="360" y1="148" x2="360" y2="172" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="270" y="172" width="180" height="44" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
<text x="360" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500A">Recurring need?</text>

<line x1="320" y1="216" x2="280" y2="240" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="200" y="240" width="120" height="40" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<text x="260" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500A">Project</text>

<line x1="360" y1="216" x2="360" y2="240" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="330" y="240" width="100" height="40" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<text x="380" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500A">Skill</text>

<line x1="400" y1="216" x2="450" y2="240" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="450" y="240" width="110" height="40" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<text x="505" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500A">Memory</text>

<!-- Making branches: file, artifact, code, design, cowork -->
<line x1="460" y1="148" x2="460" y2="172" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="380" y="172" width="160" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="460" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#712B13">What kind of output?</text>

<line x1="420" y1="216" x2="380" y2="380" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="330" y="380" width="100" height="40" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5"/>
<text x="380" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#72243E">A file</text>

<line x1="440" y1="216" x2="470" y2="380" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="440" y="380" width="110" height="40" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5"/>
<text x="495" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#72243E">An artifact</text>

<line x1="460" y1="216" x2="565" y2="380" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="565" y="380" width="90" height="40" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5"/>
<text x="610" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#72243E">Code</text>

<line x1="490" y1="216" x2="530" y2="440" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="470" y="440" width="120" height="40" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5"/>
<text x="530" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#72243E">A design</text>

<line x1="505" y1="216" x2="620" y2="440" stroke="#5B5647" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="605" y="440" width="65" height="40" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5"/>
<text x="637" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="600" fill="#72243E">Cowork</text>

</svg>
